[project]
name = "mjlab-ws"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
  "mjlab[cu130]",   # 按你实际的 CUDA 选 cu130 / cu126 / cpu
  "cartpole",
]

[tool.uv]
package = false     # 根本身不打包，只做 workspace 容器

[tool.uv.workspace]
members = ["mjlab", "cartpole"]

[tool.uv.sources]
mjlab = { workspace = true }
cartpole = { workspace = true }

# 以下 index 从 mjlab/pyproject.toml 原样复制到根目录。
# 注意：workspace 只读取根目录的这类全局配置，成员 pyproject 里的 [tool.uv]
# index/conflicts 会被忽略，所以必须放这里。
[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
